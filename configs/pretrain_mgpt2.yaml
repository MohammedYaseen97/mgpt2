# Pretraining config (mgpt2 tokenizer)

name: mgpt2_custom_tokenizer

tokenizer:
  kind: mgpt2_regex_bpe
  model_file: tokenizer/artifacts/mgpt2.model
  vocab_size: 50257
  vocab_padded: 50304

data:
  shards_dir: data/shards_mgpt2

train:
  seed: 1337
  block_size: 1024
  total_batch_size: 524288   # effective gradient-step size (tokens)
  # micro_batch_size: 16       # 4xL4 24GB  — grad_accum_steps = 524288 / (16*1024*4) = 8
  micro_batch_size: 64       # 1xH100 80GB — grad_accum_steps = 524288 / (64*1024*1) = 8
  # max_steps is FIXED to match the baseline run (27,538 steps = 14.44B tokens).
  # Cloud mgpt2 shards derive ~24,695 steps from manifest (slight rebuild difference vs local).
  # Extra ~2,843 steps cycle through data once more (~11.5% partial second pass) — harmless.
  max_steps: 27538
  warmup_steps: 715
  max_lr: 0.003
  min_lr_ratio: 0.1
  weight_decay: 0.1
  eval_interval: 250

eval:
  eval_manifest: data/eval/manifest.json   # bucketed heldout sets (latin/deva/knda/mixed)

