name: dpo_mgpt2_custom_tokenizer_smoke

sft_checkpoint: auto

tokenizer:
  kind: mgpt2
  model_file: tokenizer/artifacts/mgpt2.model

train:
  seed: 1337
  shards_dir: data/shards_dpo
  batch_size: 8
  micro_batch_size: 2
  beta: 0.1
  max_lr: 1.0e-6
  min_lr_ratio: 0.1
  warmup_steps: 2
  epochs: 1
  max_steps: 5            # override epochs — run exactly 5 gradient steps
  weight_decay: 0.1
  eval_interval: 2
