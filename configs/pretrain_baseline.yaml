# Pretraining config (baseline)
#
# ALREADY DONE engine: `train.py`
# Your TODO later is to create a thin wrapper that reads this config and runs the same settings.

name: baseline_gpt2_tokenizer

tokenizer:
  kind: gpt2_tiktoken   # baseline
  vocab_padded: 50304

data:
  shards_dir: data/shards_gpt2
  shard_prefix: null

train:
  seed: 1337
  block_size: 1024
  total_batch_size: 524288   # effective gradient-step size (tokens)
  micro_batch_size: 16       # 4xL4 24GB — grad_accum_steps = 524288 / (16*1024*4) = 8
  # micro_batch_size: 64       # H100 80GB
  # max_steps is FIXED here so both runs see the same token budget (fair comparison).
  # mgpt2 shards: 14,438,211,234 tokens → 27,538 steps (1 full epoch).
  # gpt2 shards:  31,864,557,355 tokens → would be 60,776 steps (1 epoch) if unset.
  # Setting max_steps = 27,538 here ensures both models process exactly
  # 27,538 × 524,288 = 14,437,842,944 tokens — same compute budget, only tokenizer differs.
  max_steps: 27538
  warmup_steps: 715
  max_lr: 0.003
  min_lr_ratio: 0.1
  weight_decay: 0.1
  eval_interval: 250

eval:
  eval_manifest: data/eval/manifest.json   # bucketed heldout sets (latin/deva/knda/mixed)

